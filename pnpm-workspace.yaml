blockExoticSubdeps: true

allowBuilds:
  "@prisma/engines": false
  "@sentry/cli": true
  esbuild: false
  prisma: false
  sharp: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.3.0
  vite-plus: ^0.3.3

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

patchedDependencies:
  # Types-only patch — dist/index.mjs is untouched, so runtime behaviour is
  # unchanged. See patches/better-auth-paystack@3.2.1.patch for why it exists.
  better-auth-paystack@3.2.1: patches/better-auth-paystack@3.2.1.patch
