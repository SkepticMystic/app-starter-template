blockExoticSubdeps: true

# A publish must be 24h old before it resolves — the window a hijacked package
# usually lives in. The lockfile stays authoritative.
#
# `vp migrate` appends a `minimumReleaseAgeExclude` for the Vite+ toolchain;
# delete it after each run.
minimumReleaseAge: 1440

allowBuilds:
  "@prisma/engines": false
  "@sentry/cli": true
  esbuild: false
  prisma: false
  sharp: true

# Re-pinned by `vp migrate` on a Vite+ bump; do not edit by hand. `vitest` must
# equal the runner `vite-plus` bundles (`vp toolchain vitest`), or the override
# splits mocks and `expect` state between two copies.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  "@vitest/coverage-v8": 5.0.1
  "@vitest/ui": 5.0.1

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

patchedDependencies:
  # Types-only patch — dist/index.mjs is untouched, so runtime behaviour is
  # unchanged. patches/README.md says what each patch changes and when it
  # can go.
  better-auth-paystack@3.2.1: patches/better-auth-paystack@3.2.1.patch
