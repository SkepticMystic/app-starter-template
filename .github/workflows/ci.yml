# The repo's quality gate. Vercel's own build validates only the Vercel path;
# this also builds and boots the plain-node server the container ships. Needs
# no secrets: the tests run against the mock wall in `src/test/setup.ts`, and
# the build reads `.env.example`'s placeholders.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick second commit shouldn't leave the old run burning a
# runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Skips `vp config`'s hook install on a throwaway checkout.
  VP_GIT_HOOKS: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Before setup-node, which needs pnpm on PATH for `cache: pnpm`. Reads
      # `packageManager`, and installs pnpm without corepack.
      - uses: pnpm/action-setup@v6

      # `.nvmrc` is the one place the major is written, besides the
      # Dockerfile's `ARG NODE_VERSION`. .npmrc sets engine-strict=true, so a
      # mismatch with `engines.node` fails at install rather than later.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nothing before this can dirty the tree except the install, whose
      # `prepare` (`vp config && svelte-kit sync`) rewrites generated files.
      - name: No generated file drifted
        run: git diff --exit-code

      # `APP_ENV` and the `PUBLIC_*` set are build-time (`static`), so Vite
      # refuses to load the config without them — and every step below loads
      # it. .env.example is that manifest, which makes CI the thing that keeps
      # the manifest honest.
      - run: cp .env.example .env

      - name: src/env.ts is internally consistent
        run: pnpm env:check

      # What the pre-commit hook runs with --fix: format, lint, type-aware lint.
      - run: pnpm exec vp check

      # The only thing that type-checks `.svelte` files. Includes
      # `check:scripts`, the erasable-syntax guard on bare-node entrypoints.
      - run: pnpm check

      - run: pnpm test:run

      # Better-Auth's own diff of `schema.ts` against the real `auth.ts`, under
      # the test suite's mock environment, so it needs no secrets either.
      - run: pnpm auth:check

      # Unused files and dependencies only; unused exports are judgement calls
      # left to `pnpm knip` (and so `pnpm verify`).
      - run: pnpm knip:ci

      # No VERCEL in the environment, so this exercises the adapter-node path —
      # the one Vercel's own builds never cover.
      - run: pnpm build

      # adapter-node does NOT load .env in production, hence --env-file. This is
      # the step that exercises the `required` variables in src/env.ts at
      # startup, so .env.example's placeholders have to be non-empty.
      - name: Check the built server boots
        run: |
          PORT=3000 node --env-file=.env build &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "server responded"; exit 0
            fi
            sleep 1
          done
          echo "server did not respond within 30s"; exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # trufflehog diffs base..head, and needs the history to do it

      # GitHub-native secret scanning needs GHAS on a private repo. Pinned to a
      # release: a secret scanner is not a thing to run from a moving ref.
      #
      # `--results=verified`: with `unknown`, a placeholder DSN in a fixture
      # fails the build, since the Postgres detector verifies by connecting.
      # The cost is that an unverifiable leak goes unreported. This scans only
      # the commit range; run `pnpm scan:secrets` against a full clone for
      # history.
      - uses: trufflesecurity/trufflehog@v3.97.5
        with:
          extra_args: --results=verified
